<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">Menstrual Advocacy</div>
        <div class="nav-toggle" onclick="toggleMenu()">☰</div>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="donate.html">Donate</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

  <header class="contact-header">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Whether you have questions, ideas, or want to get involved—reach out.</p>
  </header>

  <section class="contact-section">
    <div class="contact-info">
      <h2>Get in Touch</h2>
      <p><strong>Email:</strong> info@menstrualadvocacy.org</p>
      <p><strong>Phone:</strong> +233 123 456 789</p>
      <p><strong>Location:</strong> Accra, Ghana</p>
    </div>

    <div class="contact-form-box">
      <h2>Send a Message</h2>
      <form action="send_message.php" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }
  </script>

</body>
</html>
